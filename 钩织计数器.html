<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>钩织计数器</title>
<style>
  body{background:#0d1117;color:#e6edf3;font-family:sans-serif;margin:0;
       height:100vh;display:flex;flex-direction:column;
       align-items:center;justify-content:center}
  .num{font-size:96px;font-weight:bold;color:#7aa2f7}
  button{background:#1a2332;color:#e6edf3;border:1px solid #30475e;
         border-radius:12px;padding:12px 26px;font-size:16px;
         margin:8px;cursor:pointer}
  button:hover{border-color:#7aa2f7}
</style>
</head>
<body>
  <div class="num" id="num">0</div>
  <div>
    <button onclick="add()">+1 圈</button>
    <button onclick="reset()">重置</button>
  </div>

<script>
let n = Number(localStorage.getItem("n") || 0);

function render() {
  document.getElementById("num").textContent = n;
}

function add() {
  n++;
  localStorage.setItem("n", n);
  render();
}

function reset() {
  n = 0;
  localStorage.setItem("n", n);
  render();
}

render();
</script>
</body>
</html>
